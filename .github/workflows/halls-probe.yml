name: ホール 下調べ（ブランチ用）
on:
  push:
    branches: [halls-watch]
    paths: ["halls/probe.mjs", ".github/workflows/halls-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps --only-shell chromium
      - run: node halls/probe.mjs
        env:
          URLS: "https://www.yoyaku.city.ota.tokyo.jp/ https://web02.rsv.ws-scs.jp/chofu/web/ https://www.city.edogawa.tokyo.jp/e030/kuseijoho/denshi/shisetsuyoyaku/index.html https://www.city.ageo.lg.jp/page/17-shisetuyoyaku.html https://www.muse-tokorozawa.or.jp/guide/search.php https://www.cm9.eprs.jp/shinagawa/web/index.jsp https://www.city.tokorozawa.saitama.jp/shisetu/yoyaku/index.html"
