name: 大阪 試し実行（作るとき用）
on:
  push:
    branches: [osaka-watch]
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
      - run: node osaka/watch.mjs
        env:
          DEBUG: "1"
          YANAGIBA_SECRET: ${{ secrets.YANAGIBA_SECRET }}
