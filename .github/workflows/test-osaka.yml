name: 大阪 試し実行（作るとき用）
on:
  push:
    branches: [osaka-watch]
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps --only-shell chromium
      - run: node kadoma/watch.mjs
        env:
          DEBUG: "1"
          FORCE: "1"
          DEBUG_DIR: debug-kadoma
          YANAGIBA_SECRET: ${{ secrets.YANAGIBA_SECRET }}
