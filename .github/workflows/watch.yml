name: けやきネット空き監視

on:
  schedule:
    - cron: "0,30 * * * *"   # 30分おき（:00と:30。GitHub側の混雑で数分遅れることがあります）
  workflow_dispatch:
    inputs:
      debug:
        description: "各画面のスクショを保存する（動作確認用）"
        type: boolean
        default: true
      test_notify:
        description: "LINEにテスト通知だけ送る"
        type: boolean
        default: false

concurrency:
  group: keyakinet-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npx playwright install --with-deps --only-shell chromium

      - name: 前回の通知記録を復元
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: 監視実行
        env:
          DEBUG: ${{ inputs.debug && '1' || '0' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          TEST_NOTIFY: ${{ inputs.test_notify && '1' || '0' }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          YANAGIBA_SECRET: ${{ secrets.YANAGIBA_SECRET }}
        run: node watch.mjs

      - name: 通知記録を保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}

      - name: スクショをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screens
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
