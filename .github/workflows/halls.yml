name: ホール空き監視（ざわめき祭）

on:
  schedule:
    - cron: "51 0-14,22-23 * * *"   # 予備（ふだんは YANAGIBA の Supabase から毎時51分・日本時間7〜23時台）
  workflow_dispatch:
    inputs:
      debug:
        description: "読み取った表をログに出す（動作確認用）"
        type: boolean
        default: true
      notify_all:
        description: "今の空きを（通知済みの分も含めて）全部LINEに送る"
        type: boolean
        default: false
      test_notify:
        description: "LINEにテスト通知だけ送る"
        type: boolean
        default: false

concurrency:
  group: halls-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 前回の通知記録を復元
        uses: actions/cache/restore@v4
        with:
          path: state-halls
          key: halls-state-${{ github.run_id }}
          restore-keys: halls-state-

      - name: 監視実行
        env:
          DEBUG: ${{ inputs.debug && '1' || '0' }}
          FORCE: ${{ github.event_name != 'schedule' && '1' || '0' }}
          TEST_NOTIFY: ${{ inputs.test_notify && '1' || '0' }}
          NOTIFY_ALL: ${{ inputs.notify_all && '1' || '0' }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          YANAGIBA_SECRET: ${{ secrets.YANAGIBA_SECRET }}
          HALLS_SHEET_URL: ${{ secrets.HALLS_SHEET_URL }}
          HALLS_SHEET_SECRET: ${{ secrets.HALLS_SHEET_SECRET }}
        run: node halls/watch.mjs

      - name: 通知記録を保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state-halls
          key: halls-state-${{ github.run_id }}
