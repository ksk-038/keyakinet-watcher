name: 施設シートとアプリの空きの突き合わせ（点検）
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: 突き合わせ
        env:
          YANAGIBA_SECRET: ${{ secrets.YANAGIBA_SECRET }}
        run: node tools/room-audit.mjs
