name: 通信の記録（作るとき用）
on:
  push:
    branches: [net-probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        w: [watch, bunkyo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install
      - run: npx playwright install --with-deps --only-shell chromium
      - run: node ${{ matrix.w == 'watch' && 'watch.mjs' || 'bunkyo/watch.mjs' }}
        env: { NETLOG: "1", FORCE: "1", YANAGIBA_SECRET: "${{ secrets.YANAGIBA_SECRET }}" }
      - if: always()
        run: |
          git config user.name Claude && git config user.email noreply@anthropic.com
          mkdir -p netlogs && gzip -c netlog.json > netlogs/${{ matrix.w }}.json.gz || true
          git add -f netlogs && git commit -qm "通信の記録 ${{ matrix.w }}" && for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
