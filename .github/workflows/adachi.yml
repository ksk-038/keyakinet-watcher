name: 足立区 空き監視（一時的）

on:
  schedule:
    - cron: "27 0-14,22-23 * * *"   # 一時的な監視：1時間おき（日本時間7〜23時台）。いらなくなったら config.json の dates を空にする
  workflow_dispatch:
    inputs:
      debug:
        description: "読み取った中身をログに出す（動作確認用）"
        type: boolean
        default: true
      notify_all:
        description: "今の空きを（通知済みの分も含めて）全部LINEに送る"
        type: boolean
        default: false
      test_notify:
        description: "LINEにテスト通知だけ送る"
        type: boolean
        default: false

concurrency:
  group: adachi-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: 前回の通知記録を復元
        uses: actions/cache/restore@v4
        with:
          path: state-adachi
          key: adachi-state-${{ github.run_id }}
          restore-keys: adachi-state-

      - name: 監視実行
        env:
          DEBUG: ${{ inputs.debug && '1' || '0' }}
          FORCE: ${{ github.event_name != 'schedule' && '1' || '0' }}
          TEST_NOTIFY: ${{ inputs.test_notify && '1' || '0' }}
          NOTIFY_ALL: ${{ inputs.notify_all && '1' || '0' }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          YANAGIBA_SECRET: ${{ secrets.YANAGIBA_SECRET }}
        run: node adachi/watch.mjs

      - name: 通知記録を保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state-adachi
          key: adachi-state-${{ github.run_id }}

      - name: スクショをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screens-adachi
          path: debug-adachi/
          if-no-files-found: ignore
          retention-days: 3
