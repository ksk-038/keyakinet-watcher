name: 大阪 試し実行2（作るとき用）
on:
  push:
    branches: [osaka2]
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
      - run: node pf489/watch.mjs
        env: { DEBUG: "1", FORCE: "1", YANAGIBA_SECRET: "${{ secrets.YANAGIBA_SECRET }}" }
      - run: node osaka/watch.mjs
        if: always()
        env: { DEBUG: "1", YANAGIBA_SECRET: "${{ secrets.YANAGIBA_SECRET }}" }
