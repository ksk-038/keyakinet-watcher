name: 板橋区 空き監視

on:
  push:
    branches: [itabashi]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps --only-shell chromium
      - run: node itabashi/probe.mjs
      - name: 調査結果をブランチに置く
        if: always()
        run: |
          cd debug-itabashi && rm -f *.png && git init -q && git checkout -q -b dbg-itabashi
          git add -A && git -c user.name=bot -c user.email=bot@example.com commit -qm dbg
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" dbg-itabashi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-screens-itabashi
          path: debug-itabashi/
          retention-days: 3
