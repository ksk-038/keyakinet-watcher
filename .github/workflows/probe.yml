name: 大阪 画面確認（作るとき用）
on:
  push:
    branches: [osaka-probe]
    paths: [probe/**, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps --only-shell chromium
      - run: node probe/probe.mjs
        env:
          URLS: ${{ '["https://www.shisetsu-osaka.jp/shisetsu-nw/akijokyo.html?scd=26","https://www.shisetsu-osaka.jp/shisetu-nw/fusetsu.html","https://www4.pf489.com/moriguchi/web/","https://www4.pf489.com/Neyagawa/Web","https://shisetsu-yoyaku.jp/kadoma/"]' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe-out, path: probe-out/, retention-days: 1 }
