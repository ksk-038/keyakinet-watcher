name: 大阪 画面確認（作るとき用）
on:
  push:
    branches: [osaka-probe]
    paths: [probe/**, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps --only-shell chromium
      - run: node probe/probe.mjs
      - name: 結果をブランチに置く
        if: always()
        run: |
          git config user.name Claude && git config user.email noreply@anthropic.com
          git add -f probe-out && git commit -qm "画面確認の結果" && git push -q
