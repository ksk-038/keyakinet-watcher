name: 調べもの 利用目的ごとの部屋一覧

on:
  workflow_dispatch:
    inputs:
      site:
        description: "itabashi / kadoma / moriguchi / neyagawa（http で始まるURLを空白区切りで入れると、資料のダウンロードだけする）"
        required: true
        default: itabashi

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 資料のダウンロード（URLを入れたとき）
        if: startsWith(inputs.site, 'http')
        env:
          URLS: ${{ inputs.site }}
        run: |
          mkdir docs; i=0
          for u in $URLS; do i=$((i+1)); curl -sSL -m 60 -A "Mozilla/5.0" -o "docs/$i-$(basename "${u%%\?*}")" "$u" || echo "失敗 $u"; done
          ls -la docs
      - if: startsWith(inputs.site, 'http')
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs
      - uses: actions/checkout@v4
        if: ${{ !startsWith(inputs.site, 'http') }}
      - uses: actions/setup-node@v4
        if: ${{ !startsWith(inputs.site, 'http') }}
        with:
          node-version: 22
          cache: npm
      - run: npm install
        if: ${{ !startsWith(inputs.site, 'http') }}
      - name: ブラウザを前回の保存から戻す
        if: ${{ !startsWith(inputs.site, 'http') }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps --only-shell chromium
        if: ${{ !startsWith(inputs.site, 'http') }}
      - name: 一覧づくり
        if: ${{ !startsWith(inputs.site, 'http') }}
        env:
          YANAGIBA_SECRET: ${{ secrets.YANAGIBA_SECRET }}
        run: node tools/purposes.mjs ${{ inputs.site }}
