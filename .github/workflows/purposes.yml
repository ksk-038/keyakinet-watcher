name: 調べもの 利用目的ごとの部屋一覧

on:
  workflow_dispatch:
    inputs:
      site:
        description: "itabashi / kadoma / moriguchi / neyagawa"
        required: true
        default: itabashi

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: ブラウザを前回の保存から戻す
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps --only-shell chromium
      - name: 一覧づくり
        env:
          YANAGIBA_SECRET: ${{ secrets.YANAGIBA_SECRET }}
        run: node tools/purposes.mjs ${{ inputs.site }}
