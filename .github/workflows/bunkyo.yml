name: 文京区 空き監視

on:
  push:
    branches: [bunkyo-watcher]   # 動作確認用（マージ前に消す）
  schedule:
    - cron: "7-59/15 * * * *"   # 15分おき（世田谷と重ならないよう7分ずらし）
  workflow_dispatch:
    inputs:
      debug:
        description: "各画面のスクショを保存する（動作確認用）"
        type: boolean
        default: true
      test_notify:
        description: "LINEにテスト通知だけ送る"
        type: boolean
        default: false

concurrency:
  group: bunkyo-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npx playwright install --with-deps --only-shell chromium

      - name: 前回の通知記録を復元
        uses: actions/cache/restore@v4
        with:
          path: state-bunkyo
          key: bunkyo-state-${{ github.run_id }}
          restore-keys: bunkyo-state-

      - name: 監視実行
        env:
          DEBUG: ${{ (github.event_name == 'push' || inputs.debug) && '1' || '0' }}
          FORCE: ${{ github.event_name != 'schedule' && '1' || '0' }}
          TEST_NOTIFY: ${{ inputs.test_notify && '1' || '0' }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: node bunkyo/watch.mjs

      - name: 通知記録を保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state-bunkyo
          key: bunkyo-state-${{ github.run_id }}

      - name: スクショをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screens-bunkyo
          path: debug-bunkyo/
          if-no-files-found: ignore
          retention-days: 3
